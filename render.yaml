# Tukra Backend - Render Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: tukra-backend
    runtime: node
    rootDir: tukra-backend
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tukra-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENABLE_DEMO_PAY
        value: "true"
      - key: ALLOW_DEMO_PAY_IN_PROD
        value: "true"
      - key: TINYFISH_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: DEMO_MENU_URL
        sync: false

databases:
  - name: tukra-postgres
    databaseName: tukra
    user: tukra_admin
    plan: free
    region: singapore
    ipAllowList: [] # Allow internal Render network and external connections
